<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>工程進捗入力</title>
<script src="config.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif; font-size: 18px; background: #f3f4f6; color: #111; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ログイン */
  #login { max-width: 460px; margin: 0 auto; padding: 24px 16px; }
  #login h1 { font-size: 26px; text-align: center; margin: 8px 0 20px; }
  .field { background: #fff; border: 3px solid #d1d5db; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .field.on { border-color: #2563eb; }
  .field label { display: block; font-size: 14px; color: #6b7280; }
  .field .val { font-size: 32px; font-weight: bold; min-height: 42px; letter-spacing: 4px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .keypad button { min-height: 72px; font-size: 30px; font-weight: bold; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .keypad button.sub { background: #e5e7eb; font-size: 20px; }
  .keypad button.go { grid-column: span 3; background: #2563eb; color: #fff; font-size: 24px; }
  .err { color: #dc2626; font-weight: bold; min-height: 26px; text-align: center; margin-top: 8px; }

  /* 本体 */
  header { position: sticky; top: 0; z-index: 10; background: #1f2937; color: #fff; padding: 8px 12px; }
  .who { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin-bottom: 6px; }
  .who button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #4b5563; color: #fff; font-size: 16px; }
  .procs { display: flex; flex-wrap: wrap; gap: 6px; }
  .procs button { flex: 1 1 0; min-width: 80px; min-height: 56px; font-size: 18px; font-weight: bold; border: 0; border-radius: 8px; background: #374151; color: #fff; }
  .procs button.on { background: #f59e0b; color: #111; }
  .fixed { font-size: 24px; font-weight: bold; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button { flex: 1; min-height: 48px; font-size: 18px; border: 0; border-radius: 8px; background: #4b5563; color: #fff; }
  .tabs button.on { background: #fff; color: #111; font-weight: bold; }
  main { padding: 12px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 0; font-size: 20px; padding: 12px; border: 2px solid #9ca3af; border-radius: 8px; }
  .btn { min-height: 56px; padding: 0 20px; font-size: 18px; font-weight: bold; border: 0; border-radius: 8px; background: #2563eb; color: #fff; }
  .btn.gray { background: #6b7280; }
  .btn.green { background: #16a34a; }
  .btn.orange { background: #ea580c; }
  .btn:disabled { opacity: .5; }
  .muted { color: #6b7280; font-size: 15px; }

  .scanwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 760px) { .scanwrap { grid-template-columns: 1fr; } }
  #reader { width: 100%; background: #000; border-radius: 10px; overflow: hidden; min-height: 60px; }
  #reader video { width: 100% !important; }

  #result { border-left: 12px solid #9ca3af; min-height: 180px; }
  #result.ok { border-color: #16a34a; background: #f0fdf4; }
  #result.complete { border-color: #2563eb; background: #eff6ff; }
  #result.warn { border-color: #f59e0b; background: #fffbeb; }
  #result.ng { border-color: #dc2626; background: #fef2f2; }
  .rhead { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .pno { font-size: 26px; font-weight: bold; word-break: break-all; }
  .count { font-size: 40px; font-weight: bold; margin: 6px 0; }
  .steps { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .steps span { padding: 4px 8px; border-radius: 6px; background: #e5e7eb; font-size: 14px; }
  .steps span.done { background: #16a34a; color: #fff; }
  .steps span.cur { outline: 3px solid #f59e0b; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }
  #recent { list-style: none; padding: 0; margin: 0; }
  #recent li { padding: 8px 4px; border-bottom: 1px solid #e5e7eb; font-size: 15px; display: flex; gap: 8px; }
  #recent li .t { color: #6b7280; width: 64px; flex: none; }
  #recent li.ng { color: #dc2626; }
  #recent li.warn { color: #b45309; }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { min-height: 48px; padding: 0 14px; font-size: 16px; border: 2px solid #2563eb; background: #fff; color: #2563eb; border-radius: 8px; }
  .seg button.on { background: #2563eb; color: #fff; }
  .datebar { justify-content: center; }
  .datebar .big { min-width: 120px; text-align: center; font-size: 26px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; background: #fff; }
  th, td { padding: 10px 6px; border-bottom: 1px solid #e5e7eb; font-size: 15px; word-break: break-all; vertical-align: top; }
  th { background: #e5e7eb; text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:active { background: #fef3c7; }
  td.st { text-align: center; font-weight: bold; }
  td.st.done { color: #16a34a; }
  td.st.todo { color: #dc2626; }
  td.st.part { color: #b45309; }
  @media (max-width: 700px) { .colSpec, .colCno { display: none; } }

  #loading { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; color: #fff; font-size: 24px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 101; font-size: 18px; }
</style>
</head>
<body>

<!-- ログイン -->
<section id="login" class="hidden">
  <h1>工程進捗入力</h1>
  <div class="field on" data-f="emp"><label>社員番号</label><div class="val" id="vEmp"></div></div>
  <div class="field" data-f="pin"><label>暗証番号</label><div class="val" id="vPin"></div></div>
  <div class="keypad" id="keypad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="sub" data-k="clear">全消去</button><button>0</button><button class="sub" data-k="bs">1字消す</button>
    <button class="go" data-k="go">ログイン</button>
  </div>
  <div class="err" id="loginErr"></div>
</section>

<!-- 本体 -->
<section id="app" class="hidden">
  <header>
    <div class="who"><span id="whoName"></span><button id="btnLogout">ログアウト</button></div>
    <div id="procArea"></div>
    <div class="tabs">
      <button data-tab="scan" class="on">スキャン</button>
      <button data-tab="list">一覧</button>
    </div>
  </header>

  <main>
    <section id="tab-scan">
      <div class="scanwrap">
        <div>
          <div class="card">
            <div class="row">
              <button class="btn" id="btnCamera" style="flex:1">カメラ開始</button>
              <button class="btn gray hidden" id="btnStop" style="flex:1">カメラ停止</button>
            </div>
            <div class="muted" id="camMsg" style="margin-top:6px"></div>
            <div id="reader" style="margin-top:8px"></div>
            <div class="row" style="margin-top:10px">
              <input type="text" id="pnoInput" placeholder="P.No（スキャナー・手入力）" autocomplete="off" autocapitalize="characters">
              <button class="btn" id="btnEnter">入力</button>
            </div>
          </div>
        </div>
        <div>
          <div class="card" id="result"><div class="muted">QRコードを読み取ると、ここに結果が出ます。</div></div>
          <div class="card">
            <div class="muted" style="margin-bottom:4px">このログイン中の記録</div>
            <ul id="recent"></ul>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-list" class="hidden">
      <div class="card">
        <div class="row">
          <div class="seg" id="viewSeg">
            <button data-view="date" class="on">出荷日ごと</button>
            <button data-view="here">手元に来ているもの</button>
            <button data-view="all">未完了すべて</button>
          </div>
          <button class="btn gray" id="btnReload">再読込</button>
        </div>
        <div class="row datebar" id="dateBar" style="margin-top:10px">
          <button class="btn gray" id="datePrev">◀</button>
          <span class="big" id="dateLabel">--</span>
          <button class="btn gray" id="dateNext">▶</button>
        </div>
        <div class="row" style="margin-top:10px">
          <input type="text" id="search" placeholder="品番・注番・品名・P.Noで検索">
        </div>
        <div class="muted" id="listCount" style="margin-top:6px"></div>
      </div>
      <table>
        <thead><tr>
          <th style="width:22%">P.No</th>
          <th class="colCno" style="width:9%">注番</th>
          <th style="width:18%">品番</th>
          <th>品名</th>
          <th class="colSpec" style="width:12%">色</th>
          <th style="width:7%">数</th>
          <th style="width:8%">出荷</th>
          <th style="width:11%">状態</th>
        </tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </section>
  </main>
</section>

<div id="loading" class="hidden">通信中…</div>
<div id="toast" class="hidden"></div>

<script>
const API_URL = window.APP_CONFIG.API_URL;
const IDLE_MS = 60 * 60 * 1000;   // 操作がないまま1時間でログアウト
const SAME_CODE_MS = 2500;        // 同じQRを続けて読んだときの無視時間
const FIXED = (new URLSearchParams(location.search).get('process') || '').toUpperCase();

const S = {
  token: '', user: null, processes: [], rows: [], today: '',
  proc: '', view: 'date', dates: [], dateIdx: 0,
  busy: false, last: null, recent: [],
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 保存（共用iPadなので最終操作時刻と一緒に持つ）----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem('koutei') || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('koutei', JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem('koutei'); } catch (e) {} },
};
function touch() {
  if (S.token) store.set({ token: S.token, user: S.user, proc: S.proc, at: Date.now() });
}

// ---------- 通信 ----------
function loading(on) { S.busy = on; $('loading').classList.toggle('hidden', !on); }

async function api(action, data) {
  // Content-Type を付けない（text/plain）ことで、GASへのCORSプリフライトを避ける
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action, token: S.token }, data || {})),
  });
  const j = await res.json();
  if (!j.ok) {
    if (j.auth) logout(j.error);
    throw new Error(j.error);
  }
  touch();
  return j;
}

let toastTimer = null;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 2500);
}

// ---------- 音 ----------
let audioCtx = null;
function tone(freq, start, dur) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.value = 0.25;
  o.start(audioCtx.currentTime + start);
  o.stop(audioCtx.currentTime + start + dur);
}
function sound(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (kind === 'ok') tone(1500, 0, 0.1);
    else if (kind === 'complete') { tone(1500, 0, 0.1); tone(2000, 0.15, 0.15); }
    else if (kind === 'warn') { tone(800, 0, 0.15); tone(800, 0.25, 0.15); tone(800, 0.5, 0.15); }
    else if (kind === 'ng') tone(300, 0, 0.6);
  } catch (e) {}
}

// ---------- ログイン ----------
const L = { field: 'emp', emp: '', pin: '' };
function renderLogin() {
  $('vEmp').textContent = L.emp;
  $('vPin').textContent = '●'.repeat(L.pin.length);
  document.querySelectorAll('.field').forEach(f => f.classList.toggle('on', f.dataset.f === L.field));
}
document.querySelectorAll('.field').forEach(f => f.addEventListener('click', () => { L.field = f.dataset.f; renderLogin(); }));
$('keypad').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  sound(); // iOSはユーザー操作のときに音声を有効化しておく
  const k = b.dataset.k;
  if (k === 'go') return doLogin();
  if (k === 'clear') L[L.field] = '';
  else if (k === 'bs') L[L.field] = L[L.field].slice(0, -1);
  else if (L[L.field].length < 10) L[L.field] += b.textContent;
  $('loginErr').textContent = '';
  renderLogin();
});

async function doLogin() {
  if (!L.emp) { L.field = 'emp'; renderLogin(); return; }
  if (!L.pin) { L.field = 'pin'; renderLogin(); return; }
  if (S.busy) return;
  loading(true);
  try {
    const j = await api('login', { emp: L.emp, pin: L.pin });
    S.token = j.token; S.user = j.user;
    L.emp = ''; L.pin = ''; L.field = 'emp'; renderLogin();
    await enterApp();
  } catch (e) {
    $('loginErr').textContent = e.message;
    L.pin = ''; L.field = 'pin'; renderLogin();
    sound('ng');
  } finally {
    loading(false);
  }
}

function showLogin(msg) {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
  renderLogin();
}

function logout(msg) {
  stopCamera();
  if (S.token && !msg) api('logout').catch(() => {});
  S.token = ''; S.user = null; S.last = null; S.recent = [];
  store.clear();
  showLogin(msg);
}
$('btnLogout').onclick = () => { if (confirm('ログアウトしますか？')) logout(); };

// 一定時間操作がなければログアウト
setInterval(() => {
  const s = store.get();
  if (S.token && (!s || Date.now() - s.at > IDLE_MS)) logout('操作がなかったためログアウトしました');
}, 60 * 1000);

// ---------- 本体 ----------
async function enterApp() {
  const j = await api('init');
  S.processes = j.processes; S.rows = j.rows; S.today = j.today; S.user = j.user;
  if (FIXED && S.processes.some(p => p.code === FIXED)) S.proc = FIXED;
  if (!S.processes.some(p => p.code === S.proc)) S.proc = S.processes[0].code;
  touch();
  buildDates();
  $('whoName').textContent = S.user.name + '（' + S.user.emp + '）';
  renderProcs(); renderRecent(); renderList();
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
}

async function reload() {
  loading(true);
  try {
    const j = await api('init');
    S.rows = j.rows; S.today = j.today;
    const cur = S.dates[S.dateIdx];
    buildDates();
    const i = S.dates.indexOf(cur);
    if (i >= 0) S.dateIdx = i;
    renderList();
  } catch (e) {
    toast(e.message);
  } finally {
    loading(false);
  }
}

function procName(code) { const p = S.processes.find(x => x.code === code); return p ? p.name : code; }

function renderProcs() {
  if (FIXED && S.proc === FIXED) {
    $('procArea').innerHTML = '<div class="fixed">工程：' + esc(procName(FIXED)) + '</div>';
    return;
  }
  $('procArea').innerHTML = '<div class="procs">' + S.processes.map(p =>
    '<button data-proc="' + p.code + '" class="' + (p.code === S.proc ? 'on' : '') + '">' + esc(p.name) + '</button>'
  ).join('') + '</div>';
}
$('procArea').addEventListener('click', e => {
  const b = e.target.closest('button[data-proc]');
  if (!b) return;
  S.proc = b.dataset.proc;
  S.last = null;
  touch();
  renderProcs(); renderList();
  $('result').className = 'card';
  $('result').innerHTML = '<div class="muted">工程を「' + esc(procName(S.proc)) + '」に切り替えました。</div>';
});

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('tab-scan').classList.toggle('hidden', b.dataset.tab !== 'scan');
  $('tab-list').classList.toggle('hidden', b.dataset.tab !== 'list');
  if (b.dataset.tab !== 'scan') stopCamera();
});

// ---------- スキャン ----------
async function submit(pno, opts) {
  pno = String(pno || '').trim();
  if (!pno) return;
  if (S.busy) { toast('処理中です。少し待ってください'); return; }
  loading(true);
  try {
    const j = await api('scan', Object.assign({ process: S.proc, pno: pno }, opts || {}));
    applyResult(j, pno);
  } catch (e) {
    showError(pno, e.message);
  } finally {
    loading(false);
    $('pnoInput').value = '';
  }
}

function applyResult(j, pno) {
  if (j.row) updateLocalRow(j.row, j.count);
  if (j.result === 'ok') {
    S.last = { id: j.id, pno: pno, proc: S.proc };
    sound(j.completed ? 'complete' : 'ok');
    addRecent('ok', pno, j.qty > 1 ? j.count + '/' + j.qty + (j.completed ? ' 完了' : '') : '完了');
  } else if (j.result === 'already') {
    sound('warn');
    addRecent('warn', pno, '完了済み（警告）');
  } else if (j.result === 'shipped') {
    sound('warn');
    addRecent('warn', pno, '出荷済み');
  } else {
    sound('ng');
    addRecent('ng', pno, 'マスターになし');
  }
  renderResult(j, pno);
  renderList();
  // 一覧から入力したときは結果カードが見えないので、内容を短く出す
  if (!$('tab-list').classList.contains('hidden')) toast(S.recent[0].pno + '：' + S.recent[0].text);
}

function renderResult(j, pno) {
  const el = $('result');
  const proc = esc(procName(S.proc));
  if (j.result === 'shipped' || j.result === 'notfound') {
    el.className = 'card ' + (j.result === 'shipped' ? 'warn' : 'ng');
    el.innerHTML = '<div class="rhead">' + (j.result === 'shipped' ? '出荷済みです' : 'マスターに見つかりません') + '</div>' +
      '<div class="pno">' + esc(pno) + '</div>' +
      '<div class="muted">' + (j.result === 'shipped' ? 'DONEシートにあります。' : 'ラベルの読み間違いか、未登録のP.Noです。') + '（警告として記録）</div>';
    return;
  }
  const r = j.row;
  let head, cls;
  if (j.result === 'already') { head = '⚠ ' + proc + 'は完了済みです'; cls = 'warn'; }
  else if (j.completed) { head = '✔ ' + proc + ' 完了'; cls = 'complete'; }
  else { head = proc + ' 1個カウント'; cls = 'ok'; }
  el.className = 'card ' + cls;

  const showAll = j.result === 'ok' && !j.completed && j.qty > 1;
  const canUndo = j.result === 'ok' && S.last && S.last.id === j.id;
  el.innerHTML =
    '<div class="rhead">' + head + (j.round > 1 ? '（' + j.round + '回目）' : '') + '</div>' +
    '<div class="pno">' + esc(r.pno) + '</div>' +
    '<div>' + esc(r.code) + '　' + esc(r.name) + '</div>' +
    '<div class="muted">注番 ' + esc(r.cno) + '／色 ' + esc(r.color) + '／出荷 ' + esc(r.due) + '</div>' +
    '<div class="count">' + (j.qty > 1 ? j.qty + '個中 ' + j.count + '個' : '数量 1') + '</div>' +
    '<div class="steps">' + S.processes.map(p =>
      '<span class="' + (r.done[p.code] ? 'done ' : '') + (p.code === S.proc ? 'cur' : '') + '">' + esc(p.name) + '</span>'
    ).join('') + '</div>' +
    '<div class="actions">' +
      (showAll ? '<button class="btn green" id="btnAll">全数完了（残り' + (j.qty - j.count) + '個）</button>' : '') +
      (canUndo ? '<button class="btn orange" id="btnUndo">取り消し</button>' : '') +
    '</div>';
  if (showAll) $('btnAll').onclick = () => {
    if (confirm(r.pno + ' の残り' + (j.qty - j.count) + '個を完了にしますか？')) submit(r.pno, { all: true });
  };
  if (canUndo) $('btnUndo').onclick = undoLast;
}

function showError(pno, msg) {
  sound('ng');
  addRecent('ng', pno, msg);
  $('result').className = 'card ng';
  $('result').innerHTML = '<div class="rhead">エラー</div><div class="pno">' + esc(pno) + '</div><div>' + esc(msg) + '</div>';
}

async function undoLast() {
  if (!S.last || S.busy) return;
  const last = S.last;
  loading(true);
  try {
    const j = await api('undo', { id: last.id });
    S.last = null;
    if (j.row) updateLocalRow(j.row, null, j.process, j.count);
    sound('ok');
    addRecent('warn', last.pno, '取り消し');
    $('result').className = 'card warn';
    $('result').innerHTML = '<div class="rhead">取り消しました</div><div class="pno">' + esc(last.pno) + '</div>' +
      '<div>' + esc(procName(j.process)) + (j.qty > 1 ? '：' + j.qty + '個中 ' + j.count + '個' : '') + '</div>';
    renderList();
  } catch (e) {
    toast(e.message);
  } finally {
    loading(false);
  }
}

function updateLocalRow(row, count, proc, procCount) {
  const local = S.rows.find(x => x.pno === row.pno);
  if (!local) return;
  local.done = row.done;
  local.count = local.count || {};
  if (count != null) local.count[S.proc] = count;
  if (proc) local.count[proc] = procCount;
}

function addRecent(kind, pno, text) {
  const t = new Date();
  S.recent.unshift({ kind: kind, pno: pno, text: text, proc: procName(S.proc),
    time: String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0') });
  S.recent = S.recent.slice(0, 15);
  renderRecent();
}
function renderRecent() {
  $('recent').innerHTML = S.recent.map(r =>
    '<li class="' + r.kind + '"><span class="t">' + r.time + '</span><span>' + esc(r.proc) + '　' + esc(r.pno) + '　' + esc(r.text) + '</span></li>'
  ).join('') || '<li class="muted">まだありません</li>';
}

$('btnEnter').onclick = () => submit($('pnoInput').value);
$('pnoInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(e.target.value); } });

// カメラ：開いたまま連続で読む。同じQRは一定時間無視する
let cam = null, lastCode = '', lastAt = 0;
async function startCamera() {
  sound();
  $('camMsg').textContent = '起動中…';
  try {
    cam = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
    await cam.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onDecode,
      () => {}
    );
    $('camMsg').textContent = 'QRコードを枠に入れてください';
    $('btnCamera').classList.add('hidden');
    $('btnStop').classList.remove('hidden');
  } catch (e) {
    cam = null;
    $('camMsg').textContent = 'カメラを起動できません：' + (e && e.message ? e.message : e);
  }
}
function onDecode(text) {
  const now = Date.now();
  if (text === lastCode && now - lastAt < SAME_CODE_MS) return;
  if (S.busy) return;
  lastCode = text; lastAt = now;
  submit(text);
}
async function stopCamera() {
  if (!cam) return;
  const c = cam;
  cam = null;
  try { await c.stop(); c.clear(); } catch (e) {}
  $('btnCamera').classList.remove('hidden');
  $('btnStop').classList.add('hidden');
  $('camMsg').textContent = '';
}
$('btnCamera').onclick = startCamera;
$('btnStop').onclick = stopCamera;

// ---------- 一覧 ----------
// 出荷日は「MM-dd」で年がないため、今日から±6か月の範囲で年を補って並べる
function dueKey(s) {
  const m = /^(\d{1,2})-(\d{1,2})$/.exec(s || '');
  if (!m) return null;
  const tm = Number(S.today.split('-')[0]);
  const mon = Number(m[1]);
  let y = 0;
  if (mon - tm > 6) y = -1; else if (tm - mon > 6) y = 1;
  return y * 10000 + mon * 100 + Number(m[2]);
}
function buildDates() {
  const set = new Set(S.rows.map(r => r.due).filter(d => dueKey(d) !== null));
  S.dates = [...set].sort((a, b) => dueKey(a) - dueKey(b));
  const t = dueKey(S.today);
  const i = S.dates.findIndex(d => dueKey(d) >= t);
  S.dateIdx = i >= 0 ? i : Math.max(0, S.dates.length - 1);
}
$('datePrev').onclick = () => { if (S.dateIdx > 0) { S.dateIdx--; renderList(); } };
$('dateNext').onclick = () => { if (S.dateIdx < S.dates.length - 1) { S.dateIdx++; renderList(); } };
$('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  S.view = b.dataset.view;
  document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});
$('search').addEventListener('input', renderList);
$('btnReload').onclick = reload;

function isDone(r) {
  const d = r.done[S.proc];
  if (d === null) return ((r.count || {})[S.proc] || 0) >= r.qty; // 組付：履歴の数で判定
  return d;
}
function statusCell(r) {
  if (isDone(r)) return '<td class="st done">済</td>';
  const c = (r.count || {})[S.proc] || 0;
  if (c > 0) return '<td class="st part">' + c + '/' + r.qty + '</td>';
  return '<td class="st todo">未</td>';
}

const MAX_ROWS = 300;
let shownRows = [];
function renderList() {
  $('dateBar').classList.toggle('hidden', S.view !== 'date');
  $('dateLabel').textContent = S.dates[S.dateIdx] || '--';

  const q = $('search').value.trim().toLowerCase();
  let rows = S.rows;
  if (S.view === 'date') {
    const d = S.dates[S.dateIdx];
    rows = rows.filter(r => r.due === d);
  } else {
    rows = rows.filter(r => !isDone(r));
    if (S.view === 'here') rows = rows.filter(r => r.prevDone[S.proc]);
    rows = rows.slice().sort((a, b) => (dueKey(a.due) ?? 1e9) - (dueKey(b.due) ?? 1e9));
  }
  if (q) rows = rows.filter(r => [r.code, r.cno, r.name, r.pno].some(x => String(x).toLowerCase().includes(q)));

  shownRows = rows.slice(0, MAX_ROWS);
  $('listCount').textContent = procName(S.proc) + '：' + rows.length + '件（行をタップすると完了にできます）';
  $('listBody').innerHTML = shownRows.map((r, i) =>
    '<tr data-i="' + i + '">' +
    '<td>' + esc(r.pno) + '</td>' +
    '<td class="colCno">' + esc(r.cno) + '</td>' +
    '<td>' + esc(r.code) + '</td>' +
    '<td>' + esc(r.name) + (r.spec ? '<div class="muted">' + esc(r.spec) + '</div>' : '') + '</td>' +
    '<td class="colSpec">' + esc(r.color) + '</td>' +
    '<td>' + r.qty + '</td>' +
    '<td>' + esc(r.due) + '</td>' +
    statusCell(r) +
    '</tr>'
  ).join('') + (rows.length > MAX_ROWS ? '<tr><td colspan="8" class="muted">先頭' + MAX_ROWS + '件を表示中。検索で絞り込んでください。</td></tr>' : '');
}

// ラベルが剥がれたときなどの手動入力
$('listBody').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]');
  if (!tr) return;
  const r = shownRows[Number(tr.dataset.i)];
  if (!r || isDone(r)) return;
  const rest = r.qty - (((r.count || {})[S.proc]) || 0);
  if (!confirm(r.pno + '（' + r.name + '）\n' + procName(S.proc) + 'を完了にしますか？' + (r.qty > 1 ? '（残り' + rest + '個すべて）' : ''))) return;
  submit(r.pno, { all: true, source: 'list' });
});

// ---------- 起動 ----------
(async function boot() {
  const s = store.get();
  if (s && s.token && Date.now() - s.at < IDLE_MS) {
    S.token = s.token; S.user = s.user; S.proc = s.proc || '';
    loading(true);
    try {
      await enterApp();
      return;
    } catch (e) {
      // 期限切れなどはログイン画面へ
    } finally {
      loading(false);
    }
  }
  store.clear();
  S.token = '';
  showLogin();
})();
</script>
